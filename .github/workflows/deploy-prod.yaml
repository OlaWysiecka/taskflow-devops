name: Deploy TaskFlow to PROD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Diagnose Tailscale connection
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -eu
          tailscale ping --timeout=10s "$PROD_HOST"
          echo "Tailscale connection verified."

      - name: Validate deployment secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          echo "Required SSH secrets are configured."

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check production configuration
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$PROD_USER@$PROD_HOST" \
            'test -d "$HOME/taskflow-devops" &&
             test -f "$HOME/taskflow-devops/.env" &&
             echo "Production configuration exists."'

      - name: Stop before deployment
        run: |
          echo "Preflight passed."
          echo "Actual deployment remains disabled pending database configuration verification."