
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-devops-app:dev
    volumes:
      - ./app:/app/app
    environment:
      FLASK_DEBUG: "1"
    command:
      - python
      - -m
      - flask
      - --app
      - app
      - run
      - --debug
      - --host=0.0.0.0
      - --port=5000

  db:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: taskflow_dev_data
